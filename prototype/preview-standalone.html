  background-color: color-mix(in srgb, var(--foreground) 6%, var(--secondary));
}

.form-select:focus-visible {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-check {
  display: flex;
  min-height: 20px;
  align-items: center;
  gap: 6px;
}

.form-check-input {
  appearance: none;
  width: 14px;
  height: 14px;
  flex: 0 0 auto;
  margin: 0;
  border: 1px solid var(--input);
  color: var(--primary-foreground);
  background-color: transparent;
  cursor: var(--cursor-interaction, default);
  transition:
    background-color 150ms,
    border-color 150ms,
    box-shadow 150ms;
}

.form-check:not(.form-switch) .form-check-input[type=&quot;checkbox&quot;] {
  border-color: var(--input);
  border-radius: var(--radius-sm);
  corner-shape: var(--corner-shape);
  background-color: var(--secondary);
  box-shadow: var(--shadow-sm);
}

.form-check:not(.form-switch)
  .form-check-input:not(:disabled):not(:checked):hover {
  background-color: var(--card);
}

.form-check:not(.form-switch) .form-check-input[type=&quot;checkbox&quot;]:checked {
  border-color: var(--primary);
  background-color: var(--primary);
}

.form-check:not(.form-switch)
  .form-check-input[type=&quot;checkbox&quot;]:checked::before {
  display: block;
  width: 100%;
  height: 100%;
  background: var(--primary-foreground);
  content: &quot;&quot;;
  mask: var(--checkmark-image) center / 12px 12px no-repeat;
}

.form-check-input[type=&quot;radio&quot;] {
  width: 14px;
  height: 14px;
  border-radius: var(--radius-full);
}

.form-check-input[type=&quot;radio&quot;]:checked {
  border: 2px solid var(--primary);
  background:
    radial-gradient(circle, var(--primary-foreground) 0 2.5px, transparent 3px),
    var(--primary);
}

.form-check:not(.form-switch) .form-check-input:focus-visible {
  outline: 2px solid var(--ring);
  outline-offset: 2px;
}

.form-check:not(.form-switch) .form-check-input:disabled {
  cursor: not-allowed;
  pointer-events: none;
}

.form-check:not(.form-switch) .form-check-input:disabled + .form-check-label {
  cursor: not-allowed;
}

.form-switch .form-check-input:disabled,
.form-switch .form-check-input:disabled + .form-check-label {
  cursor: not-allowed;
  opacity: 0.6;
}

.form-check-label {
  color: var(--foreground);
  cursor: var(--cursor-interaction, default);
}

.form-switch .form-check-input {
  position: relative;
  width: 32px;
  height: 20px;
  border: 0;
  border-radius: var(--radius-full);
  background: var(--muted);
  box-shadow: none;
  transition: background-color 200ms cubic-bezier(0, 0, 0.2, 1);
}

.form-switch .form-check-input::before {
  position: absolute;
  top: 50%;
  left: 0;
  width: 16px;
  height: 16px;
  box-sizing: border-box;
  border: 1px solid light-dark(var(--primary-foreground), var(--foreground));
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
  box-shadow: var(--shadow-sm);
  content: &quot;&quot;;
  transform: translate(2px, -50%);
  transition: transform 200ms cubic-bezier(0, 0, 0.2, 1);
}

.form-switch .form-check-input:checked {
  background: var(--primary);
}

.form-switch .form-check-input:checked::before {
  transform: translate(14px, -50%);
}

.form-switch .form-check-input:focus-visible {
  box-shadow: 0 0 0 2px var(--ring);
}

.form-range {
  appearance: none;
  display: block;
  width: 100%;
  height: 28px;
  flex: 1;
  margin: 0;
  padding: 0;
  outline: none;
  border: 0;
  accent-color: var(--primary);
  background: linear-gradient(
      color-mix(in srgb, var(--foreground) 7%, transparent),
      color-mix(in srgb, var(--foreground) 7%, transparent)
    )
    center / 100% 2px no-repeat;
}

.form-range::-webkit-slider-runnable-track {
  height: 28px;
  background: transparent;
}

.form-range::-webkit-slider-thumb {
  appearance: none;
  width: 20px;
  height: 20px;
  margin-top: 4px;
  border: 1px solid var(--border);
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
}

.form-range:focus-visible::-webkit-slider-thumb {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-range::-moz-range-track {
  height: 28px;
  background: transparent;
}

.form-range::-moz-range-thumb {
  width: 20px;
  height: 20px;
  border: 1px solid var(--border);
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
}

.form-range:focus-visible::-moz-range-thumb {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-range:disabled {
  cursor: not-allowed;
  opacity: 0.4;
}

.btn:not(.btn-primary, .viz-tile):is(
  [aria-pressed=&quot;true&quot;],
  [aria-selected=&quot;true&quot;],
  .is-selected
) {
  border-color: var(--primary);
  color: var(--primary-foreground);
  background: var(--primary);
}

.btn.viz-tile:is([aria-pressed=&quot;true&quot;], [aria-selected=&quot;true&quot;], .is-selected) {
  border-color: var(--primary);
  box-shadow: inset 0 0 0 1px var(--primary);
}

.btn:focus-visible,
.nav-link:focus-visible {
  outline: 2px solid var(--ring);
  outline-offset: 2px;
}

@media (pointer: coarse) {
  .btn,
  .nav-link,
  .form-control,
  .form-select {
    min-width: 44px;
    min-height: 44px;
  }

  /* Keep small-screen WebKit from zooming when a text field receives focus. */
  .form-control,
  .form-select {
    font-size: max(16px, var(--font-size-normal));
  }

  .form-control[type=&quot;file&quot;]::file-selector-button {
    min-width: 44px;
    min-height: 44px;
  }

  .form-control-color[type=&quot;color&quot;] {
    width: 44px;
    height: 44px;
  }

  .form-control:is(
    [type=&quot;date&quot;],
    [type=&quot;datetime-local&quot;],
    [type=&quot;month&quot;],
    [type=&quot;time&quot;],
    [type=&quot;week&quot;]
  ) {
    min-width: 0;
    max-width: 100%;
    padding-block: 8px;
  }

  .form-check {
    min-height: 44px;
    padding-inline: 15px;
  }

  .form-check-input {
    position: relative;
  }

  .form-check-input::after {
    position: absolute;
    top: 50%;
    left: 50%;
    width: 44px;
    height: 44px;
    content: &quot;&quot;;
    transform: translate(-50%, -50%);
  }

  .form-check-label {
    display: inline-flex;
    min-width: 44px;
    min-height: 44px;
    align-items: center;
  }

  .form-range {
    height: 44px;
    touch-action: pan-y;
  }

  .form-range::-webkit-slider-runnable-track {
    height: 44px;
  }

  .form-range::-moz-range-track {
    height: 44px;
  }

  .form-range::-webkit-slider-thumb {
    margin-top: 12px;
  }
}

svg {
  display: block;
  max-width: 100%;
  height: auto;
}

#widget &gt; svg {
  width: 100%;
}

/* Model-authored chart rules can otherwise stretch icons after these styles load. */
svg.lucide {
  display: block;
  width: var(--icon-size) !important;
  height: var(--icon-size) !important;
  flex: none;
  margin: 0 !important;
  stroke-width: 1.6;
}

.text-warning,
.text-destructive {
  color: var(--destructive);
}

  &lt;script&gt;
  (()=&gt;{
    const root=document.getElementById(&#x27;kantv-preview&#x27;),screen=root.querySelector(&#x27;#kt-screen&#x27;),pageSelect=root.querySelector(&#x27;#kt-page&#x27;),stateSelect=root.querySelector(&#x27;#kt-state&#x27;),feedback=root.querySelector(&#x27;#kt-feedback&#x27;);
    const channels=[{name:&#x27;山野频道&#x27;,show:&#x27;山野之间&#x27;,next:&#x27;四季风物&#x27;,group:&#x27;纪实&#x27;},{name:&#x27;生活频道&#x27;,show:&#x27;家常味道&#x27;,next:&#x27;街巷人家&#x27;,group:&#x27;生活&#x27;},{name:&#x27;戏曲频道&#x27;,show:&#x27;梨园春色&#x27;,next:&#x27;经典选段&#x27;,group:&#x27;戏曲&#x27;},{name:&#x27;人文频道&#x27;,show:&#x27;行走中国&#x27;,next:&#x27;书香时光&#x27;,group:&#x27;纪实&#x27;}];

    function guide(){let ids=visible();return `&lt;div class=&quot;kt-guide&quot;&gt;&lt;div class=&quot;kt-guide-top&quot;&gt;${scene(true)}&lt;div&gt;&lt;div class=&quot;kt-title&quot;&gt;${program(st.selected)}&lt;/div&gt;&lt;div class=&quot;kt-sub&quot;&gt;${channels[st.selected].name}${st.condition===&#x27;noepg&#x27;?&#x27; · 仍可观看&#x27;:&#x27; · 19:00–19:30&#x27;}&lt;/div&gt;&lt;div class=&quot;kt-sub&quot;&gt;${st.playing===st.selected?&#x27;确认进入全屏&#x27;:&#x27;确认开始预览&#x27;}&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;kt-grid&quot;&gt;&lt;div class=&quot;kt-time&quot;&gt;今天&lt;/div&gt;&lt;div class=&quot;kt-time&quot;&gt;${st.condition===&#x27;noepg&#x27;?&#x27;当前&#x27;:&#x27;19:00&#x27;}&lt;/div&gt;&lt;div class=&quot;kt-time&quot;&gt;${st.condition===&#x27;noepg&#x27;?&#x27;下一节目&#x27;:&#x27;19:30&#x27;}&lt;/div&gt;${ids.map(i=&gt;`&lt;div class=&quot;kt-rowname&quot;&gt;${st.playing===i?&#x27;▸ &#x27;:&#x27;&#x27;}${channels[i].name}&lt;/div&gt;${btn(program(i),`guide:${i}:0`,st.page===&#x27;guide&#x27;&amp;&amp;st.selected===i&amp;&amp;st.col===0)}${btn(st.condition===&#x27;noepg&#x27;?&#x27;暂无节目单&#x27;:channels[i].next,`guide:${i}:1`,st.page===&#x27;guide&#x27;&amp;&amp;st.selected===i&amp;&amp;st.col===1)}`).join(&#x27;&#x27;)}&lt;/div&gt;&lt;/div&gt;`;}
    const options={epg:[&#x27;跟随播放列表&#x27;,&#x27;中文公共节目单（候选）&#x27;,&#x27;自定义 XMLTV&#x27;,&#x27;关闭节目单&#x27;],logos:[&#x27;播放列表优先&#x27;,&#x27;中文台标库补全（候选）&#x27;,&#x27;国际频道资料库（候选）&#x27;,&#x27;仅显示频道名称&#x27;],update:[&#x27;每天&#x27;,&#x27;每 12 小时&#x27;,&#x27;手动更新&#x27;]};
    function settingRows(){return [
      [[&#x27;启动后&#x27;,&#x27;恢复上次频道并全屏播放&#x27;],[&#x27;日常界面&#x27;,&#x27;仅必要频道与节目信息&#x27;]],
      [[&#x27;示例播放列表&#x27;,&#x27;4 个虚构频道 · 仅原型&#x27;],[&#x27;添加播放列表&#x27;,&#x27;模拟导入演示样例&#x27;,&#x27;import&#x27;]],
      [[&#x27;节目单来源&#x27;,st.epg,&#x27;option:epg&#x27;],[&#x27;频道匹配&#x27;,&#x27;优先频道标识；重名时由家人指定&#x27;],[&#x27;自动更新&#x27;,st.update,&#x27;option:update&#x27;],[&#x27;立即更新&#x27;,&#x27;尚未连接真实来源&#x27;,&#x27;refresh&#x27;],[&#x27;时间校正&#x27;,&#x27;自动识别时区；可按来源调整&#x27;],[&#x27;更新状态&#x27;,&#x27;未下载 · 原型选择不验证源可用性&#x27;]],
      [[&#x27;台标来源&#x27;,st.logos,&#x27;option:logos&#x27;],[&#x27;匹配规则&#x27;,&#x27;优先已有台标；缺失时按频道资料补全&#x27;],[&#x27;手动指定台标&#x27;,&#x27;可为单个频道纠正&#x27;],[&#x27;本地缓存&#x27;,&#x27;加载失败保留旧台标；没有台标显示名称&#x27;]],
      [[&#x27;字体大小&#x27;,&#x27;大号&#x27;],[&#x27;焦点样式&#x27;,&#x27;高对比填充&#x27;]],
      [[&#x27;播放策略&#x27;,&#x27;自动 · 待实际播放测试后确定&#x27;],[&#x27;音轨与字幕&#x27;,&#x27;后续阶段&#x27;],[&#x27;画面比例&#x27;,&#x27;默认保持原比例&#x27;],[&#x27;回看、时移、录制、多画面&#x27;,&#x27;按依赖分期实现&#x27;]],

      [[&#x27;备份配置&#x27;,&#x27;含频道匹配、节目单和台标设置&#x27;],[&#x27;恢复配置&#x27;,&#x27;后续阶段&#x27;]],
      [[&#x27;当前版本&#x27;,&#x27;交互原型，无真实播放内核&#x27;],[&#x27;网络、解码、错误与更新详情&#x27;,&#x27;正式版本在这里展示&#x27;],[&#x27;设备兼容&#x27;,&#x27;两台设备均待实测&#x27;]]
    ][st.setting];}
    function settingBody(){if(st.option)return `&lt;div class=&quot;kt-title&quot;&gt;${st.option===&#x27;epg&#x27;?&#x27;节目单来源&#x27;:st.option===&#x27;logos&#x27;?&#x27;台标来源&#x27;:&#x27;自动更新&#x27;}&lt;/div&gt;&lt;div class=&quot;kt-sub&quot;&gt;选择仅用于原型演示&lt;/div&gt;${options[st.option].map((v,i)=&gt;btn(v,`pick:${i}`,i===st.optionIndex)).join(&#x27;&#x27;)}`;return `&lt;div class=&quot;kt-title&quot;&gt;${categories[st.setting]}&lt;/div&gt;${settingRows().map((r,j)=&gt;btn(r[0],`row:${j}`,st.detail&amp;&amp;j===st.row,r[1])).join(&#x27;&#x27;)}`;}
    function render(){screen.style.setProperty(&#x27;--kt-size&#x27;,st.font+&#x27;px&#x27;);pageSelect.value=[&#x27;controls&#x27;,&#x27;menu&#x27;,&#x27;groups&#x27;,&#x27;import&#x27;,&#x27;program&#x27;].includes(st.page)?(st.page===&#x27;groups&#x27;||st.page===&#x27;program&#x27;?&#x27;guide&#x27;:st.page===&#x27;import&#x27;?&#x27;settings&#x27;:&#x27;player&#x27;):st.page;stateSelect.value=st.condition;let out=&#x27;&#x27;;
      if(st.condition===&#x27;empty&#x27;&amp;&amp;st.page!==&#x27;settings&#x27;&amp;&amp;st.page!==&#x27;import&#x27;){out=`&lt;div class=&quot;kt-status&quot;&gt;&lt;div class=&quot;kt-title&quot;&gt;还没有频道&lt;/div&gt;&lt;div class=&quot;kt-sub&quot;&gt;添加播放列表后，就可以开始看电视。&lt;/div&gt;${btn(&#x27;添加播放列表&#x27;,&#x27;import&#x27;,true)}&lt;/div&gt;`;}
      else if(st.page===&#x27;import&#x27;){out=`&lt;div class=&quot;kt-status&quot;&gt;&lt;div class=&quot;kt-title&quot;&gt;添加播放列表&lt;/div&gt;&lt;div class=&quot;kt-sub&quot;&gt;本次仅演示导入流程，不读取真实文件或地址。&lt;/div&gt;${btn(&#x27;导入示例频道&#x27;,&#x27;sample&#x27;,true)}${btn(&#x27;返回设置&#x27;,&#x27;settings&#x27;)}&lt;/div&gt;`;}
      else if(st.condition===&#x27;loading&#x27;&amp;&amp;st.page===&#x27;player&#x27;){out=`&lt;div class=&quot;kt-status&quot;&gt;&lt;div class=&quot;kt-title&quot;&gt;正在打开 ${channels[st.playing].name}&lt;/div&gt;&lt;div class=&quot;kt-sub&quot;&gt;请稍候&lt;/div&gt;${btn(&#x27;选择其他频道&#x27;,&#x27;channels&#x27;,true)}&lt;/div&gt;`;}
      else if(st.condition===&#x27;error&#x27;&amp;&amp;st.page===&#x27;player&#x27;){out=`&lt;div class=&quot;kt-status&quot;&gt;&lt;div class=&quot;kt-title&quot;&gt;暂时无法播放&lt;/div&gt;&lt;div class=&quot;kt-sub&quot;&gt;可以重试，或先看看其他频道。&lt;/div&gt;&lt;div class=&quot;kt-actions&quot;&gt;${btn(&#x27;重试&#x27;,&#x27;retry&#x27;,st.control===0)}${btn(&#x27;选择频道&#x27;,&#x27;channels&#x27;,st.control===1)}&lt;/div&gt;&lt;/div&gt;`;}
      else if(st.page===&#x27;settings&#x27;){out=`&lt;div class=&quot;kt-settings&quot;&gt;&lt;div class=&quot;kt-setting-nav&quot;&gt;&lt;div class=&quot;kt-title&quot;&gt;设置&lt;/div&gt;${categories.map((c,i)=&gt;btn(c,`setting:${i}`,st.setting===i&amp;&amp;!st.detail)).join(&#x27;&#x27;)}&lt;/div&gt;&lt;div class=&quot;kt-setting-body&quot;&gt;${settingBody()}&lt;/div&gt;&lt;/div&gt;`;}
      else if(st.page===&#x27;guide&#x27;||st.page===&#x27;groups&#x27;){out=st.page===&#x27;groups&#x27;?`&lt;div class=&quot;kt-with-groups&quot;&gt;&lt;div class=&quot;kt-groups&quot;&gt;&lt;div class=&quot;kt-title&quot;&gt;频道&lt;/div&gt;${groups.map((g,i)=&gt;btn(g,`group:${i}`,st.group===i)).join(&#x27;&#x27;)}&lt;/div&gt;${guide()}&lt;/div&gt;`:guide();}
      else if(st.page===&#x27;program&#x27;){out=`&lt;div class=&quot;kt-status&quot;&gt;&lt;div class=&quot;kt-title&quot;&gt;${channels[st.selected].next}&lt;/div&gt;&lt;div class=&quot;kt-sub&quot;&gt;19:30 开始 · ${channels[st.selected].name}&lt;/div&gt;${btn(&#x27;观看当前直播&#x27;,&#x27;live&#x27;,true)}${btn(&#x27;返回节目表&#x27;,&#x27;guide&#x27;)}&lt;/div&gt;`;}
      else{out=scene();if(st.page===&#x27;channels&#x27;){out=`&lt;div class=&quot;kt-with-list&quot;&gt;${out}&lt;/div&gt;&lt;div class=&quot;kt-side&quot;&gt;&lt;div class=&quot;kt-title&quot;&gt;${groups[st.group]}&lt;/div&gt;${visible().map(i=&gt;btn(`${String(i+1).padStart(2,&#x27;0&#x27;)}　${channels[i].name}`,`channel:${i}`,i===st.selected,program(i))).join(&#x27;&#x27;)}&lt;/div&gt;`;}if(st.page===&#x27;controls&#x27;){out+=`&lt;div class=&quot;kt-overlay&quot;&gt;&lt;div class=&quot;kt-title&quot;&gt;${program(st.playing)}&lt;/div&gt;&lt;div class=&quot;kt-sub&quot;&gt;${channels[st.playing].name}${st.condition===&#x27;noepg&#x27;?&#x27;&#x27;:&#x27; · 19:00–19:30&#x27;}&lt;/div&gt;&lt;div class=&quot;kt-actions&quot;&gt;${[&#x27;节目表&#x27;,&#x27;频道列表&#x27;,&#x27;最近观看&#x27;,&#x27;设置&#x27;].map((v,i)=&gt;btn(v,`control:${i}`,st.control===i)).join(&#x27;&#x27;)}&lt;/div&gt;&lt;/div&gt;`;}if(st.page===&#x27;menu&#x27;){out+=`&lt;div class=&quot;kt-side&quot;&gt;&lt;div class=&quot;kt-title&quot;&gt;看电视&lt;/div&gt;${[&#x27;电视&#x27;,&#x27;频道列表&#x27;,&#x27;设置&#x27;].map((v,i)=&gt;btn(v,`menu:${i}`,st.control===i)).join(&#x27;&#x27;)}&lt;/div&gt;`;}if(st.page===&#x27;player&#x27;&amp;&amp;st.info)out+=`&lt;div class=&quot;kt-overlay&quot;&gt;&lt;div class=&quot;kt-title&quot;&gt;${channels[st.playing].name}&lt;/div&gt;&lt;div&gt;${program(st.playing)}&lt;/div&gt;&lt;/div&gt;`;}
      const restoreFocus=screen.contains(document.activeElement);screen.innerHTML=out;if(restoreFocus)(screen.querySelector(&#x27;.kt-selected&#x27;)||root.querySelector(&#x27;[data-key=&quot;Enter&quot;]&#x27;)).focus({preventScroll:true});
    }
    function go(page){clearTimeout(timer);st.info=false;st.detail=false;st.option=null;st.row=0;st.page=page;st.control=0;if(page===&#x27;channels&#x27;)st.selected=visible().includes(st.playing)?st.playing:visible()[0];render();}
    function action(a){const [type,v,col]=a.split(&#x27;:&#x27;);if(type===&#x27;channel&#x27;)choose(Number(v));else if(type===&#x27;guide&#x27;){st.selected=Number(v);st.col=Number(col);if(st.col===1&amp;&amp;st.condition!==&#x27;noepg&#x27;){go(&#x27;program&#x27;);}else if(st.playing===st.selected)choose(st.selected);else choose(st.selected,true);}else if(type===&#x27;control&#x27;){st.control=Number(v);if(st.control===2){render();say(&#x27;最近观看为后续阶段，本版仅展示入口&#x27;);}else go([&#x27;guide&#x27;,&#x27;channels&#x27;,&#x27;&#x27;,&#x27;settings&#x27;][st.control]);}else if(type===&#x27;setting&#x27;){st.setting=Number(v);st.detail=true;st.row=0;st.option=null;render();}else if(type===&#x27;row&#x27;){st.row=Number(v);st.detail=true;action(settingRows()[st.row][2]||&#x27;detail&#x27;);}else if(type===&#x27;option&#x27;){st.option=v;st.optionIndex=Math.max(0,options[v].indexOf(st[v]));render();}else if(type===&#x27;pick&#x27;){const prop=st.option;st[prop]=options[prop][Number(v)];st.option=null;render();say(&#x27;已选择（仅模拟），尚未下载或验证真实资料&#x27;);}else if(type===&#x27;refresh&#x27;){say(&#x27;原型未连接真实来源；正式版会报告更新结果并保留上次可用资料&#x27;);}else if(type===&#x27;group&#x27;){st.group=Number(v);st.selected=visible()[0];go(&#x27;guide&#x27;);}else if(type===&#x27;menu&#x27;){go([&#x27;guide&#x27;,&#x27;channels&#x27;,&#x27;settings&#x27;][Number(v)]);}else if(type===&#x27;sample&#x27;){st.condition=&#x27;normal&#x27;;st.group=0;choose(0);say(&#x27;已模拟导入 4 个频道&#x27;);}else if(type===&#x27;retry&#x27;){st.condition=&#x27;loading&#x27;;render();say(&#x27;模拟重试中&#x27;);clearTimeout(timer);timer=setTimeout(()=&gt;{st.condition=&#x27;normal&#x27;;choose(st.playing);},1000);}else if(type===&#x27;live&#x27;){choose(st.selected);}else if(type===&#x27;detail&#x27;){say(&#x27;此处为设置说明；对应功能尚未实现&#x27;);}else go(type);}
    function moveChannel(delta){const ids=visible(),at=Math.max(0,ids.indexOf(st.selected));st.selected=ids[(at+delta+ids.length)%ids.length];}
    function key(k){if(st.page===&#x27;import&#x27;){if(k===&#x27;Enter&#x27;)action(&#x27;sample&#x27;);else if(k===&#x27;Escape&#x27;)go(&#x27;settings&#x27;);return;}if(st.condition===&#x27;empty&#x27;&amp;&amp;st.page!==&#x27;settings&#x27;){if(k===&#x27;Enter&#x27;)go(&#x27;import&#x27;);else if(k===&#x27;Escape&#x27;)go(&#x27;settings&#x27;);return;}if(st.page===&#x27;player&#x27;){if(st.condition===&#x27;error&#x27;){if(k===&#x27;ArrowLeft&#x27;||k===&#x27;ArrowRight&#x27;)st.control=1-st.control;else if(k===&#x27;Enter&#x27;){action(st.control===0?&#x27;retry&#x27;:&#x27;channels&#x27;);return;}else if(k===&#x27;Escape&#x27;){go(&#x27;guide&#x27;);return;}render();return;}if(st.condition===&#x27;loading&#x27;){if(k===&#x27;Enter&#x27;||k===&#x27;Escape&#x27;||k===&#x27;ArrowLeft&#x27;)go(&#x27;channels&#x27;);return;}if(k===&#x27;ArrowLeft&#x27;||k===&#x27;Enter&#x27;)go(&#x27;channels&#x27;);else if(k===&#x27;Escape&#x27;){if(st.info){st.info=false;render();}else go(&#x27;guide&#x27;);}else go(&#x27;controls&#x27;);return;}
      if(st.page===&#x27;channels&#x27;){if(k===&#x27;ArrowUp&#x27;)moveChannel(-1);if(k===&#x27;ArrowDown&#x27;)moveChannel(1);if(k===&#x27;Enter&#x27;){choose(st.selected);return;}if(k===&#x27;Escape&#x27;){go(&#x27;player&#x27;);return;}if(k===&#x27;ArrowLeft&#x27;){go(&#x27;groups&#x27;);return;}}
      else if(st.page===&#x27;guide&#x27;){if(k===&#x27;ArrowUp&#x27;)moveChannel(-1);if(k===&#x27;ArrowDown&#x27;)moveChannel(1);if(k===&#x27;ArrowRight&#x27;)st.col=1;if(k===&#x27;ArrowLeft&#x27;){if(st.col===1)st.col=0;else{go(&#x27;groups&#x27;);return;}}if(k===&#x27;Enter&#x27;){action(`guide:${st.selected}:${st.col}`);return;}if(k===&#x27;Escape&#x27;){go(&#x27;groups&#x27;);return;}}
      else if(st.page===&#x27;groups&#x27;){if(k===&#x27;ArrowUp&#x27;)st.group=(st.group+groups.length-1)%groups.length;if(k===&#x27;ArrowDown&#x27;)st.group=(st.group+1)%groups.length;st.selected=visible()[0];if(k===&#x27;Enter&#x27;||k===&#x27;ArrowRight&#x27;){go(&#x27;guide&#x27;);return;}if(k===&#x27;Escape&#x27;||k===&#x27;ArrowLeft&#x27;){go(&#x27;menu&#x27;);return;}}
      else if(st.page===&#x27;controls&#x27;||st.page===&#x27;menu&#x27;){const n=st.page===&#x27;controls&#x27;?4:3;if(k===&#x27;ArrowRight&#x27;||k===&#x27;ArrowDown&#x27;)st.control=(st.control+1)%n;if(k===&#x27;ArrowLeft&#x27;||k===&#x27;ArrowUp&#x27;)st.control=(st.control+n-1)%n;if(k===&#x27;Enter&#x27;){action(`${st.page===&#x27;controls&#x27;?&#x27;control&#x27;:&#x27;menu&#x27;}:${st.control}`);return;}if(k===&#x27;Escape&#x27;){go(st.page===&#x27;controls&#x27;?&#x27;player&#x27;:&#x27;groups&#x27;);return;}}
      else if(st.page===&#x27;settings&#x27;){
        if(st.option){const n=options[st.option].length;if(k===&#x27;Escape&#x27;||k===&#x27;ArrowLeft&#x27;)st.option=null;else if(k===&#x27;ArrowDown&#x27;)st.optionIndex=(st.optionIndex+1)%n;else if(k===&#x27;ArrowUp&#x27;)st.optionIndex=(st.optionIndex+n-1)%n;else if(k===&#x27;Enter&#x27;){action(`pick:${st.optionIndex}`);return;}}
        else if(k===&#x27;Escape&#x27;||k===&#x27;ArrowLeft&#x27;){if(st.detail)st.detail=false;else{go(&#x27;menu&#x27;);return;}}
        else if(k===&#x27;ArrowDown&#x27;||k===&#x27;ArrowUp&#x27;){const delta=k===&#x27;ArrowDown&#x27;?1:-1;if(st.detail){const n=settingRows().length;st.row=(st.row+delta+n)%n;}else{st.setting=(st.setting+delta+categories.length)%categories.length;st.row=0;}}
        else if(k===&#x27;Enter&#x27;||k===&#x27;ArrowRight&#x27;){if(st.detail&amp;&amp;k===&#x27;Enter&#x27;){action(`row:${st.row}`);return;}st.detail=true;}
      }
      else if(st.page===&#x27;program&#x27;){if(k===&#x27;Enter&#x27;){choose(st.selected);return;}if(k===&#x27;Escape&#x27;){go(&#x27;guide&#x27;);return;}}render();
    }
    root.addEventListener(&#x27;click&#x27;,e=&gt;{const b=e.target.closest(&#x27;button&#x27;);if(!b)return;if(b.dataset.action)action(b.dataset.action);if(b.dataset.key)key(b.dataset.key);});
    root.addEventListener(&#x27;keydown&#x27;,e=&gt;{if(e.target.closest(&#x27;.kt-lab&#x27;))return;if(e.key===&#x27;Enter&#x27;&amp;&amp;e.target.tagName===&#x27;BUTTON&#x27;)return;if(![&#x27;ArrowLeft&#x27;,&#x27;ArrowRight&#x27;,&#x27;ArrowUp&#x27;,&#x27;ArrowDown&#x27;,&#x27;Enter&#x27;,&#x27;Escape&#x27;].includes(e.key))return;const inScreen=screen.contains(e.target);e.preventDefault();key(e.key);if(inScreen)(screen.querySelector(&#x27;.kt-selected&#x27;)||root.querySelector(&#x27;[data-key=&quot;Enter&quot;]&#x27;)).focus({preventScroll:true});});
    pageSelect.addEventListener(&#x27;change&#x27;,()=&gt;go(pageSelect.value));stateSelect.addEventListener(&#x27;change&#x27;,()=&gt;{clearTimeout(timer);st.condition=stateSelect.value;st.info=false;st.control=0;if([&#x27;empty&#x27;,&#x27;loading&#x27;,&#x27;error&#x27;].includes(st.condition))st.page=&#x27;player&#x27;;render();say(&#x27;已切换原型状态&#x27;);});
    root.querySelector(&#x27;#kt-reopen&#x27;).addEventListener(&#x27;click&#x27;,()=&gt;{st.playing=st.saved;st.selected=st.saved;st.condition=st.condition===&#x27;empty&#x27;?&#x27;empty&#x27;:&#x27;normal&#x27;;st.group=0;go(&#x27;player&#x27;);say(&#x27;已模拟恢复上次频道；正式版本需验证持久化&#x27;);});
    render();
    if(globalThis.Tweak){const tweak=new Tweak({container:screen,onChange:render});tweak.addSlider(st,&#x27;font&#x27;,{label:&#x27;界面字号&#x27;,min:17,max:23,unit:&#x27;px&#x27;});}
  })();

&lt;script src=&quot;https://unpkg.com/@floating-ui/dom@1.7.4/dist/floating-ui.dom.umd.min.js&quot;&gt;&lt;/script&gt;
&lt;script&gt;

    window.crypto?.randomUUID?.() ?? Date.now().toString(36)
  }`;
  const tooltipGap = 5;
  const hoverDelay = 700;
  const skipDelay = 300;
  let activeTrigger = null;
  let pendingTrigger = null;
  let tooltip = null;
  let openTimeout = null;
  let autoUpdateCleanup = null;
  let positionRequest = 0;
  let skipDelayUntil = 0;
  let lastPointerWasTouch = false;
  let pinnedByTouch = false;

    target?.nodeType === Node.ELEMENT_NODE

  const containsTarget = (trigger, target) =&gt;
    target?.nodeType != null &amp;&amp; trigger.contains(target);

    trigger.getAttribute(&quot;data-tooltip&quot;)?.trim() ?? &quot;&quot;;

    const placement = trigger.getAttribute(&quot;data-tooltip-placement&quot;);
    return tooltipPlacements.has(placement) ? placement : &quot;top&quot;;
  };
  const getTooltip = () =&gt; {
    if (tooltip == null) {
      tooltip = document.createElement(&quot;div&quot;);
      tooltip.id = tooltipId;
      tooltip.className = &quot;tooltip&quot;;
      tooltip.setAttribute(&quot;role&quot;, &quot;tooltip&quot;);

        .split(/\s+/)

    clearOpenTimeout();
    pinnedByTouch = false;
    positionRequest += 1;
    autoUpdateCleanup?.();
    autoUpdateCleanup = null;
    if (activeTrigger == null) {

    activeTrigger = null;
    tooltip?.remove();

        flip({ padding: tooltipGap }),

    setDescribedBy(trigger, true);

  const requestOpen = (trigger, immediate = false) =&gt; {
    if (
      getContent(trigger).length === 0 ||
      activeTrigger === trigger ||
      pendingTrigger === trigger

      return;
    }
    clearOpenTimeout();
    pendingTrigger = trigger;
    const delay =
      immediate || activeTrigger != null || Date.now() &lt; skipDelayUntil
        ? 0

      openTooltip(trigger);

    openTimeout = window.setTimeout(() =&gt; {

      pendingTrigger = null;
      openTooltip(trigger);

  document.addEventListener(&quot;pointerdown&quot;, handlePointer);
  document.addEventListener(&quot;pointercancel&quot;, handlePointer);

  document.addEventListener(&quot;pointerout&quot;, handleLeave);

&lt;script id=&quot;codex-visualization-tabs&quot;&gt;
(() =&gt; {
